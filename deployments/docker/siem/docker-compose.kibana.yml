services:
  kibana:
    build:
      context: ../
      dockerfile: Dockerfile.kibana
    image: custom-kibana:wazuh
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN}
    ports:
      - "${KIBANA_PORT}:5601"
    networks:
      - soc-net
    restart: unless-stopped
    healthcheck:
      test: CMD-SHELL curl -f http://localhost:5601 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10

networks:
  soc-net:
    external: true
