services:
  graylog:
    image: graylog/graylog:6.0
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=http://localhost:${GRAYLOG_UI_PORT}/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
      - mongo
    ports:
      - "${GRAYLOG_UI_PORT}:9000"
      - "${GRAYLOG_SYSLOG_UDP_PORT}:1514/udp"
      - "${GRAYLOG_SYSLOG_TCP_PORT}:1514"
    networks:
      - soc-net
    restart: unless-stopped
    healthcheck:
      test: CMD-SHELL curl -fs http://localhost:9000/api/system/metrics/multiple?metric_names[]=jvm.cl.loaded_classes || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongo:
    image: mongo:6.0
    volumes:
      - mongodata:/data/db
    networks:
      - soc-net
    restart: unless-stopped
    healthcheck:
      test: CMD-SHELL mongosh --eval "db.adminCommand('ping')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongodata:

networks:
  soc-net:
    external: true
